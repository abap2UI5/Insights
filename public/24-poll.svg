<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 198" width="702" height="198" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="702" height="198" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">A long job, and the timer that asks for it</text><rect x="28" y="78" width="140" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="98" y="99.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">START</text><text x="98" y="116.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">schedules the job</text><rect x="200" y="78" width="140" height="48" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><text x="270" y="99.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">3 seconds</text><text x="270" y="116.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">a timer in the browser</text><rect x="372" y="78" width="140" height="48" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="442" y="99.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">POLL</text><text x="442" y="116.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">reads the job status</text><rect x="544" y="78" width="130" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="609" y="99.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">finished</text><text x="609" y="116.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">shows the result</text><line x1="174" y1="102" x2="194" y2="102" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><line x1="346" y1="102" x2="366" y2="102" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><line x1="518" y1="102" x2="538" y2="102" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><path d="M442 72 L442 54 L270 54 L270 72" fill="none" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="356" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">not finished - ask again</text><text x="270" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">no request, no work process</text><line x1="28" y1="160" x2="674" y2="160" stroke="#D8C7BC"/><text x="28" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">The job runs in a background work process; every poll is an ordinary, short roundtrip</text></svg>
